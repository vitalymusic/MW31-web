<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

        html{
           font-family: "Roboto", sans-serif;
           font-size: 14pt; 
           text-align: justify;
           color: #222; 
        }



        h1,h2{
             font-family: "DynaPuff", system-ui;
             text-align: center;
            color: #eee;
            /* text-shadow: 0px 0px 2px black; */
            text-transform: uppercase; 
            text-decoration: underline wavy 2px red;
            font-size: 3.5rem;
            background: linear-gradient(45deg, #07a3ec, #55ea04 );
            background-clip: text;
            color: transparent;
        }

        p{
            text-indent: 1rem;
            line-height: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 200px;    
        }

    </style>



</head>
<body>
    <h1>Google fonti</h1>
    <h2>Mācos izmantot google fontus</h2>   
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ratione architecto rerum cum, sed ducimus praesentium, eveniet dicta expedita, recusandae quis fugiat illo iure magni doloribus dolore deserunt consequuntur ipsa harum.</p>
    
</body>
</html>
